services:
  # Fastify API & WebSocket Server
  - type: web
    name: classradar-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm prisma:migrate:deploy
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: classradar-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ATTENDANCE_THRESHOLD
        value: "75"

  # Next.js Fullstack Web Application (Render Fallback)
  - type: web
    name: classradar-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NEXT_PUBLIC_NVIDIA_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b

databases:
  - name: classradar-postgres
    plan: free
    databaseName: classradar
    user: classradar
